# Rust implementation of the game-data pipeline. Duplicated (2026-11-23) from the
# starorg-strings workspace's starorg-gamedata crate, which stays as is for now. Since
# 2026-11-25 this crate is the only producer of the published dumps (the TypeScript
# pipeline under src/ was removed; docs/plans/specs/rust-pipeline.md step 4).
[workspace]
resolver = "3"
members = ["crates/sc-gamedata"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# StarBreaker: the voidput mirror of diogotr7/StarBreaker, pinned to the commit
# starorg-strings tests against. Bump together with STARBREAKER_COMMIT in src/archive.rs.
starbreaker-p4k = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
starbreaker-datacore = { git = "https://github.com/voidput/StarBreaker", rev = "041e559215e18e1b13b124cab0e3ecb0f3aa50d4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
rayon = "1"
# gzip of the per-build snapshots (snapshots/<build>/*.json.gz); pure-Rust backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# HTTP for `sc-gamedata fetch` (UEX) and `overlays fetch`: rustls + webpki roots, no native TLS.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# StarBreaker can panic on malformed data; archive::guarded turns that into an error,
# which needs unwinding.
[profile.release]
panic = "unwind"

[profile.dev]
debug = "line-tables-only"

# The archive is 100+ GB: optimise even debug builds of the reading code.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.sc-gamedata]
opt-level = 2
